name: Update Spotify

on:
  schedule:
    - cron: "*/30 * * * *" # a cada 30 minutos (UTC)
  workflow_dispatch: # permite rodar manualmente na aba Actions

permissions:
  contents: write

concurrency:
  group: spotify
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar README com o Spotify
        run: node scripts/update-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Commit se houve mudança
        run: |
          if git diff --quiet README.md; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: atualiza músicas do Spotify"
          git push
